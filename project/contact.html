<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - Кофемания</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="header">
        <div class="container header-content">
            <div class="logo">
                <img src="https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/coffee.svg" alt="Логотип" width="32" height="32">
                <h1>Кофемания</h1>
            </div>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="contact.html">Контакты</a></li>
                </ul>
            </nav>
            <button class="login-btn">Войти</button>
        </div>
    </header>

    <main class="container">
        <div class="contact-grid">
            <div class="contact-form">
                <h2>Напишите нам</h2>
                <form>
                    <div class="form-group">
                        <label for="name">Имя</label>
                        <input type="text" id="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="form-group">
                        <label for="subject">Тема</label>
                        <input type="text" id="subject" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Сообщение</label>
                        <textarea id="message" rows="4" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Отправить</button>
                </form>
            </div>

            <div class="contact-info">
                <h2>Адрес</h2>
                <div class="info-item">
                    <img src="https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/phone.svg" alt="Телефон" width="24" height="24">
                    <p>+7 (999) 123-45-67</p>
                </div>
                <div class="info-item">
                    <img src="https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/mail.svg" alt="Email" width="24" height="24">
                    <p>info@coffemania.ru</p>
                </div>
                <div class="info-item">
                    <img src="https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/map-pin.svg" alt="Адрес" width="24" height="24">
                    <p>ул. Кофейная, 42, Москва</p>
                </div>
                <div class="map">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2245.5887738251014!2d37.618696!3d55.756694!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zNTXCsDQ1JzI0LjEiTiAzN8KwMzcnMDcuMyJF!5e0!3m2!1sen!2sru!4v1635959562834!5m2!1sen!2sru"
                        width="100%"
                        height="300"
                        style="border:0;"
                        allowfullscreen=""
                        loading="lazy">
                    </iframe>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container footer-content">
            <p>© 2024 Кофемания. Все права защищены.</p>
            <div class="social-links">
                <a href="#"><img src="https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/facebook.svg" alt="Facebook" width="24" height="24"></a>
                <a href="#"><img src="https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/instagram.svg" alt="Instagram" width="24" height="24"></a>
                <a href="#"><img src="https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/twitter.svg" alt="Twitter" width="24" height="24"></a>
            </div>
        </div>
    </footer>
</body>
</html>
